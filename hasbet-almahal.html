<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#146c43">
  <title>حاسبة وزن المحل</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f3f6f4;color:#17231c;font-family:Arial,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
    .app{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 35px #183d2618}
    .head{text-align:center;margin-bottom:24px}
    .logo{width:66px;height:66px;border-radius:20px;background:#e5f4eb;display:grid;place-items:center;margin:0 auto 12px;font-size:34px}
    h1{font-size:24px;margin:0 0 7px}
    .sub{color:#718078;font-size:14px}
    label{display:block;font-weight:700;margin:18px 0 8px}
    input{width:100%;padding:16px;border:1.5px solid #dce5df;border-radius:14px;font-size:22px;outline:none;background:#fbfdfb;color:#17231c}
    input:focus{border-color:#198754}
    .result{margin-top:22px;padding:22px 14px;background:#eaf6ee;border-radius:18px;text-align:center}
    .result small{color:#52705d;font-size:14px}
    .number{font-size:38px;font-weight:800;color:#146c43;margin:9px 0}
    .kg{font-size:14px;color:#52705d}
    button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#146c43;color:#fff;font-size:17px;font-weight:700}
    .hint{text-align:center;color:#829087;font-size:12px;margin-top:18px;line-height:1.7}
  </style>
</head>
<body>
  <main class="app">
    <header class="head">
      <div class="logo">⚖️</div>
      <h1>حاسبة وزن المحل</h1>
      <div class="sub">احسب وزن البضاعة حسب المبلغ</div>
    </header>
    <label for="price">سعر الكيلو (شيكل ₪)</label>
    <input id="price" type="number" inputmode="decimal" min="0" step="any" value="36" placeholder="مثلاً 36">
    <label for="amount">المبلغ المطلوب (شيكل ₪)</label>
    <input id="amount" type="number" inputmode="decimal" min="0" step="any" value="2" placeholder="مثلاً 2">
    <section class="result" aria-live="polite">
      <small>الوزن المطلوب</small>
      <div class="number" id="grams">55.56 غرام</div>
      <div class="kg" id="kilos">0.0556 كيلو</div>
    </section>
    <button type="button" id="reset">إعادة ضبط</button>
    <div class="hint">أدخل سعر الكيلو والمبلغ، والوزن يظهر مباشرة.</div>
  </main>
<script>
  const price = document.getElementById('price');
  const amount = document.getElementById('amount');
  const grams = document.getElementById('grams');
  const kilos = document.getElementById('kilos');
  function calculate(){
    const p = Number(price.value), a = Number(amount.value);
    if(price.value === '' || amount.value === '' || !Number.isFinite(p) || !Number.isFinite(a) || p <= 0 || a < 0){
      grams.textContent = '— غرام'; kilos.textContent = 'أدخل قيماً صحيحة'; return;
    }
    const g = a / p * 1000;
    grams.textContent = g.toLocaleString('ar', {maximumFractionDigits:2}) + ' غرام';
    kilos.textContent = g.toLocaleString('ar', {maximumFractionDigits:4}) + ' كيلو';
  }
  price.addEventListener('input', calculate);
  amount.addEventListener('input', calculate);
  document.getElementById('reset').addEventListener('click',()=>{
    price.value='36'; amount.value='2'; calculate();
  });
  calculate();
</script>
</body>
</html>
